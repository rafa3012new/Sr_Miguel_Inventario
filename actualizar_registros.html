<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actualizar registros - Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    body { padding: 2rem; background: #f8f9fa; }
    .preview-table { font-size: 12px; }
    .preview-table img { max-height: 60px; max-width: 80px; object-fit: contain; }
    .preview-table tbody tr.dup > td { background-color: #ffcccc !important; }
    .preview-table tbody tr.nuevo > td { background-color: #e8f5e9 !important; }
    .preview-table tbody tr.rech > td { background-color: #fff3cd !important; color: #dc3545 !important; border-color: #dc3545 !important; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h1 class="h4 mb-0">Actualizar registros (local)</h1>
      </div>
      <div class="card-body">
        <p class="text-muted">
          Selecciona la carpeta del proyecto (la que contiene <code>index.html</code>) y el Excel source.
          Los registros con texto se validan, los duplicados se resaltan y se muestran primero.
        </p>
        <div class="row g-2 align-items-center mb-3">
          <div class="col-auto"><button id="btnDir" class="btn btn-primary">Seleccionar carpeta</button></div>
          <div class="col-auto"><button id="btnXlsx" class="btn btn-outline-primary" disabled>Seleccionar Excel</button></div>
          <div class="col-auto"><input type="date" id="fecha" class="form-control"></div>
          <div class="col-auto form-check">
            <input class="form-check-input" type="checkbox" id="modoPrueba" checked>
            <label class="form-check-label" for="modoPrueba">Escribir en archivos de prueba</label>
          </div>
        </div>
        <div id="status" class="mb-2 text-secondary"></div>
        <div class="d-flex gap-2 mb-3">
          <button id="btnAplicar" class="btn btn-success" disabled>Aplicar cambios</button>
          <button id="btnLog" class="btn btn-outline-secondary" disabled>Descargar log</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-bordered preview-table">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const statusEl = $('status');
    const COLS = ['TLGDIV', 'BRAND_NAME', 'Style_Season', 'Style', 'Style_Name', 'Color_code', 'Color_Name', 'Dm_Pk', 'Lbl_code', 'Loc', 'Size_Desc', 'QTY', 'Fecha_ingreso_QTY'];
    const LABELS = { TLGDIV: 'TLGDIV', BRAND_NAME: 'BRAND_NAME', Style_Season: 'Style Season', Style: 'Style', Style_Name: 'Style_Name', Color_code: 'Color_code', Color_Name: 'Color_Name', Dm_Pk: 'Dm/Pk', Lbl_code: 'Lbl_code', Loc: 'Loc', Size_Desc: 'Size_Desc', QTY: 'QTY', Fecha_ingreso_QTY: 'fecha_ingreso_QTY' };
    const OBLIGATORIOS = { BRAND_NAME: 'TLGDIV NAME', Style: 'Style', Color_code: 'Color_code', Size_Desc: 'Size Desc' };
    const EXCEL_COL = { TLGDIV: 'TLGDIV', BRAND_NAME: 'TLGDIV NAME', Style_Season: 'Style Season', Style: 'Style', Style_Name: 'Style Name', Color_code: 'Color_code', Color_Name: 'Color Name', Dm_Pk: 'Dm/Pk', Lbl_code: 'Lbl_code', Loc: 'Loc', Size_Desc: 'Size Desc', QTY: 'OTS INV' };

    let dirHandle = null;
    let indexText = '';
    let existing = [];
    let existingImg = {};
    let images = {};
    let preview = [];
    let logRows = [];

    function clean(v) {
      if (v === null || v === undefined) return '';
      if (typeof v === 'number' && Number.isInteger(v)) return String(v);
      return String(v).replace(/\s+/g, ' ').trim();
    }
    function unesc(s) {
      return s.replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    }
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function up(s) { return clean(s).toUpperCase(); }
    function keyOf(r) {
      return [r.BRAND_NAME, r.Style, r.Color_code, r.Size_Desc, r.Dm_Pk, r.Lbl_code, r.Loc].map(up).join('|');
    }
    function styleSortKey(s) {
      return /^\d+$/.test(s) ? [0, Number(s), ''] : [1, 0, s.toUpperCase()];
    }
    function setStatus(msg, type = 'secondary') {
      statusEl.className = 'mb-2 text-' + type;
      statusEl.textContent = msg;
    }

    function parseIndex(text) {
      const rows = [];
      const re = /<tr data-No="(\d+)"([^>]*)>([\s\S]*?)<\/tr>/g;
      let m;
      while ((m = re.exec(text)) !== null) {
        const attrs = m[2];
        const r = {};
        COLS.forEach(c => {
          const mm = attrs.match(new RegExp('data-' + c + '="([^"]*)"'));
          r[c] = mm ? unesc(mm[1]) : '';
        });
        const src = m[3].match(/<img src="([^"]+)"/);
        r.Imagen = src ? unesc(src[1]) : '';
        rows.push(r);
      }
      return rows;
    }

    async function readFile(handle) {
      return (await handle.getFile()).text();
    }

    async function ensurePermission(handle) {
      const opts = { mode: 'readwrite' };
      if ((await handle.queryPermission(opts)) === 'granted') return true;
      return (await handle.requestPermission(opts)) === 'granted';
    }

    async function extractImages(buf) {
      const zip = await JSZip.loadAsync(buf);
      const out = {};
      const drawings = Object.keys(zip.files).filter(n => /^xl\/drawings\/drawing\d+\.xml$/.test(n));
      for (const name of drawings) {
        const xml = await zip.file(name).async('string');
        const relName = name.replace('xl/drawings/', 'xl/drawings/_rels/') + '.rels';
        const relFile = zip.file(relName);
        const relXml = relFile ? await relFile.async('string') : '';
        const rels = {};
        relXml.replace(/<Relationship[^>]*>/g, tag => {
          const id = (tag.match(/Id="([^"]+)"/) || [])[1];
          const target = (tag.match(/Target="([^"]+)"/) || [])[1];
          if (id && target) rels[id] = target;
          return tag;
        });
        const doc = new DOMParser().parseFromString(xml, 'application/xml');
        const anchors = [
          ...doc.getElementsByTagNameNS('*', 'twoCellAnchor'),
          ...doc.getElementsByTagNameNS('*', 'oneCellAnchor')
        ];
        for (const an of anchors) {
          const rowEl = an.getElementsByTagNameNS('*', 'row')[0];
          const blip = an.getElementsByTagNameNS('*', 'blip')[0];
          if (!rowEl || !blip) continue;
          const row = parseInt(rowEl.textContent, 10) + 1;
          const embed = blip.getAttribute('r:embed') || blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'embed');
          const target = rels[embed];
          if (!target) continue;
          const path = 'xl/' + target.replace(/^\.\.\//, '');
          const f = zip.file(path);
          if (!f) continue;
          out[row] = { ext: path.split('.').pop().toLowerCase(), data: await f.async('uint8array') };
        }
      }
      return out;
    }

    function readExcelRows(buf) {
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: true });
      const h = aoa.findIndex(r => r.map(clean).includes('TLGDIV NAME'));
      if (h < 0) throw new Error('No se encontro el encabezado "TLGDIV NAME" en el Excel.');
      const head = aoa[h].map(clean);
      const rows = [];
      for (let i = h + 1; i < aoa.length; i++) {
        const raw = aoa[i];
        if (!raw.some(v => clean(v) !== '')) continue;
        const o = {};
        head.forEach((c, j) => { if (c) o[c] = raw[j]; });
        rows.push({ n: i + 1, o });
      }
      return rows;
    }

    function buildRecords(excelRows, fecha) {
      const accepted = [];
      const rejected = [];
      excelRows.forEach(({ n, o }) => {
        const rec = {};
        Object.keys(EXCEL_COL).forEach(k => { rec[k] = clean(o[EXCEL_COL[k]]); });
        if (rec.QTY === '') rec.QTY = '0';
        rec.Fecha_ingreso_QTY = fecha;
        rec.Imagen = '';
        rec.fila = n;
        const faltan = Object.keys(OBLIGATORIOS).filter(k => rec[k] === '').map(k => OBLIGATORIOS[k]);
        if (faltan.length) {
          rejected.push({ ...rec, motivo: 'Vacio: ' + faltan.join(', ') });
        } else {
          accepted.push(rec);
        }
      });
      return { accepted, rejected };
    }

    function rowHtml(r, no) {
      const attrs = ['data-No="' + no + '"'];
      COLS.forEach(c => attrs.push('data-' + c + '="' + esc(r[c] || '') + '"'));
      attrs.push('data-Imagen="' + (r.Imagen ? 'con imagen' : 'sin imagen') + '"');
      const cells = ['<td data-col="No">' + no + '</td>'];
      COLS.forEach(c => {
        if (c === 'QTY' || c === 'Fecha_ingreso_QTY') {
          cells.push('<td data-col="' + c + '">' + esc(r[c] || '') + '</td>');
        } else {
          cells.push('<td data-col="' + c + '">' + esc(r[c] || '') + '</td>');
        }
      });
      if (r.Imagen) {
        const p = esc(r.Imagen);
        cells.push('<td data-col="Imagen"><img src="' + p + '" loading="lazy" alt="' + p + '" class="thumb" data-full="' + p + '" onclick="openModal(this.dataset.full)" onerror="this.style.display=\'none\'"></td>');
      } else {
        cells.push('<td data-col="Imagen"></td>');
      }
      return '<tr ' + attrs.join(' ') + '>' + cells.join('') + '</tr>';
    }

    function renderPreview() {
      $('thead').innerHTML = '<tr><th>Aplicar</th><th>Estado</th><th>Fila</th>' +
        COLS.map(c => '<th>' + LABELS[c] + '</th>').join('') + '<th>Imagen</th></tr>';
      $('tbody').innerHTML = '';
      preview.forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.className = p.estado === 'rechazado' ? 'rech' : (p.estado === 'duplicado' ? 'dup' : 'nuevo');
        const chk = p.estado === 'rechazado' ? '' : '<input type="checkbox" class="form-check-input" data-i="' + i + '" ' + (p.aplicar ? 'checked' : '') + '>';
        const motivo = p.estado === 'rechazado' ? ' (' + p.motivo + ')' : '';
        const img = p.imgSrc ? '<img src="' + esc(p.imgSrc) + '">' : '';
        tr.innerHTML = '<td>' + chk + '</td><td>' + p.estado + motivo + '</td><td>' + (p.fila || '') + '</td>' +
          COLS.map(c => '<td>' + esc(p.rec[c] || '') + '</td>').join('') + '<td>' + img + '</td>';
        $('tbody').appendChild(tr);
      });
      $('tbody').querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', e => { preview[+e.target.dataset.i].aplicar = e.target.checked; });
      });
    }

    function mergeRows() {
      const rows = existing.map(r => ({ ...r }));
      const byKey = new Map();
      rows.forEach(r => { const k = keyOf(r); if (!byKey.has(k)) byKey.set(k, r); });
      let added = 0, updated = 0;
      preview.forEach(p => {
        if (!p.aplicar || p.estado === 'rechazado') return;
        const k = keyOf(p.rec);
        const target = byKey.get(k);
        if (target) {
          target.QTY = p.rec.QTY;
          target.Fecha_ingreso_QTY = p.rec.Fecha_ingreso_QTY;
          if (p.rec.Imagen && !target.Imagen) target.Imagen = p.rec.Imagen;
          updated++;
        } else {
          const nuevo = { ...p.rec };
          rows.push(nuevo);
          byKey.set(k, nuevo);
          added++;
        }
      });
      rows.sort((a, b) => {
        const ba = up(a.BRAND_NAME), bb = up(b.BRAND_NAME);
        if (ba !== bb) return ba < bb ? -1 : 1;
        const ka = styleSortKey(a.Style), kb = styleSortKey(b.Style);
        if (ka[0] !== kb[0]) return ka[0] - kb[0];
        if (ka[1] !== kb[1]) return ka[1] - kb[1];
        return ka[2] < kb[2] ? -1 : (ka[2] > kb[2] ? 1 : 0);
      });
      return { rows, added, updated };
    }

    function buildIndexText(rows) {
      const body = rows.map((r, i) => rowHtml(r, i + 1)).join('\n');
      const start = indexText.indexOf('<tbody>');
      const end = indexText.indexOf('</tbody>');
      let out = indexText.slice(0, start) + '<tbody>\n' + body + '\n' + indexText.slice(end);
      out = out.replace(/\(\d+ filas\)/, '(' + rows.length + ' filas)');
      out = out.replace(/\(mostrando \d+\)/g, '(mostrando ' + rows.length + ')');
      out = out.replace(/ de \d+\)/g, ' de ' + rows.length + ')');
      return out;
    }

    async function writeFile(name, data) {
      const fh = await dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(data);
      await w.close();
    }

    async function writeToDir(dirName, name, data) {
      const d = await dirHandle.getDirectoryHandle(dirName, { create: true });
      const fh = await d.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(data);
      await w.close();
    }

    async function imageExists(name) {
      try { await dirHandle.getFileHandle(name); return true; } catch (e) { return false; }
    }

    async function ensureImagesDir(nombre) {
      return dirHandle.getDirectoryHandle(nombre, { create: true });
    }

    $('btnDir').addEventListener('click', async () => {
      try {
        if (!window.showDirectoryPicker) {
          setStatus('Tu navegador no soporta File System Access API. Usa Chrome/Edge.', 'danger');
          return;
        }
        dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        if (!(await ensurePermission(dirHandle))) {
          setStatus('Permiso de escritura denegado.', 'danger');
          return;
        }
        const fh = await dirHandle.getFileHandle('index.html');
        indexText = await readFile(fh);
        existing = parseIndex(indexText);
        setStatus('index.html cargado: ' + existing.length + ' filas. Ahora selecciona el Excel source.', 'info');
        $('btnXlsx').disabled = false;
      } catch (err) {
        if (err.name !== 'AbortError') setStatus('Error: ' + err.message, 'danger');
      }
    });

    $('fecha').value = new Date().toISOString().slice(0, 10);

    $('btnXlsx').addEventListener('click', async () => {
      try {
        const [fileHandle] = await window.showOpenFilePicker({
          startIn: dirHandle,
          multiple: false,
          types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
        });
        await procesarExcel(await fileHandle.getFile());
      } catch (err) {
        if (err.name !== 'AbortError') setStatus('Error al seleccionar el Excel: ' + err.message, 'danger');
      }
    });

    async function procesarExcel(file) {
      try {
        const buf = await file.arrayBuffer();
        const fecha = $('fecha').value;
        const excelRows = readExcelRows(buf);
        const { accepted, rejected } = buildRecords(excelRows, fecha);
        images = await extractImages(buf);

        const keys = new Set(existing.map(keyOf));
        preview = [];
        accepted.forEach(rec => {
          const img = images[rec.fila];
          const estado = keys.has(keyOf(rec)) ? 'duplicado' : 'nuevo';
          if (img && rec.Style) rec.Imagen = 'imagenes/' + rec.Style + '.' + img.ext;
          preview.push({ rec, estado, fila: rec.fila, aplicar: true, motivo: '', imgSrc: img ? URL.createObjectURL(new Blob([img.data])) : (rec.Imagen || '') });
        });
        preview.sort((a, b) => (a.estado === b.estado ? 0 : (a.estado === 'duplicado' ? -1 : 1)));
        rejected.forEach(rec => {
          const img = images[rec.fila];
          preview.push({ rec, estado: 'rechazado', fila: rec.fila, aplicar: false, motivo: rec.motivo, imgSrc: img ? URL.createObjectURL(new Blob([img.data])) : '' });
        });

        renderPreview();
        const nDup = preview.filter(p => p.estado === 'duplicado').length;
        const nNew = preview.filter(p => p.estado === 'nuevo').length;
        setStatus('Registros con texto: ' + excelRows.length + ' | nuevos: ' + nNew + ' | duplicados: ' + nDup + ' | rechazados: ' + rejected.length, 'success');
        $('btnAplicar').disabled = false;
      } catch (err) {
        setStatus('Error al leer el Excel: ' + err.message, 'danger');
        console.error(err);
      }
    }

    $('btnAplicar').addEventListener('click', async () => {
      try {
        const prueba = $('modoPrueba').checked;
        const fecha = $('fecha').value;
        const idxName = prueba ? 'index_prueba.html' : 'index.html';
        const xlsxName = prueba ? 'inventario_con_imagenes_prueba.xlsx' : 'inventario_con_imagenes.xlsx';

        const carpetaImg = prueba ? 'imagenes_prueba' : 'imagenes';
        preview.forEach(p => {
          if (p.estado !== 'rechazado' && p.aplicar && p.rec.Imagen && images[p.fila]) {
            p.rec.Imagen = carpetaImg + '/' + p.rec.Imagen.split('/').pop();
          }
        });

        const { rows, added, updated } = mergeRows();
        await writeFile(idxName, buildIndexText(rows));

        const imgDir = await ensureImagesDir(carpetaImg);
        for (const p of preview) {
          if (!p.aplicar || p.estado === 'rechazado' || !p.rec.Imagen) continue;
          const name = p.rec.Imagen.split('/').pop();
          const img = images[p.fila];
          if (!img) continue;
          try { await imgDir.getFileHandle(name); continue; } catch (e) {}
          const fh = await imgDir.getFileHandle(name, { create: true });
          const w = await fh.createWritable();
          await w.write(img.data);
          await w.close();
        }

        const head = COLS.map(c => LABELS[c]).concat(['Imagen']);
        const data = rows.map(r => COLS.map(c => r[c] || '').concat([r.Imagen || '']));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...data]), 'Data');
        const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        await writeFile(xlsxName, out);

        const registrosLog = preview.map(p => ({
          fila: p.fila || null,
          estado: p.estado === 'rechazado' ? 'rechazado' : (p.aplicar ? (p.estado === 'duplicado' ? 'actualizado' : 'agregado') : 'excluido'),
          motivo: p.motivo || '',
          BRAND_NAME: p.rec.BRAND_NAME,
          Style: p.rec.Style,
          Color_code: p.rec.Color_code,
          Size_Desc: p.rec.Size_Desc,
          Dm_Pk: p.rec.Dm_Pk,
          Lbl_code: p.rec.Lbl_code,
          Loc: p.rec.Loc,
          QTY: p.rec.QTY,
          Fecha_ingreso_QTY: p.rec.Fecha_ingreso_QTY
        }));
        const cuenta = e => registrosLog.filter(r => r.estado === e).length;
        const resumen = {
          fecha,
          archivo: idxName,
          generado: new Date().toISOString(),
          agregados: cuenta('agregado'),
          actualizados: cuenta('actualizado'),
          excluidos: cuenta('excluido'),
          rechazados: cuenta('rechazado'),
          registros: registrosLog
        };
        logRows = [['Fila', 'Estado', 'Motivo', 'Style', 'Color_code', 'Size_Desc', 'QTY', 'Fecha']];
        registrosLog.forEach(r => {
          logRows.push([r.fila || '', r.estado, r.motivo, r.Style, r.Color_code, r.Size_Desc, r.QTY, r.Fecha_ingreso_QTY]);
        });
        const logWb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(logWb, XLSX.utils.aoa_to_sheet(logRows), 'Log');
        const ahora = new Date();
        const hora = [ahora.getHours(), ahora.getMinutes(), ahora.getSeconds()].map(n => String(n).padStart(2, '0')).join('-');
        const nombreLog = 'log_reg_' + fecha + '_' + hora;
        await writeToDir('logs_actualizar_registros', nombreLog + '.json', JSON.stringify(resumen, null, 2));
        await writeToDir('logs_actualizar_registros', nombreLog + '.xlsx', XLSX.write(logWb, { bookType: 'xlsx', type: 'array' }));
        $('btnLog').disabled = false;
        setStatus('Escrito ' + idxName + ': agregados ' + added + ', actualizados ' + updated + '. Log guardado en logs_actualizar_registros. Recarga con Ctrl+F5.', 'success');
      } catch (err) {
        setStatus('Error al escribir: ' + err.message, 'danger');
        console.error(err);
      }
    });

    $('btnLog').addEventListener('click', () => {
      const fecha = $('fecha').value;
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(logRows.length ? logRows : [['(sin datos)']]), 'Log');
      XLSX.writeFile(wb, 'log_' + fecha + '.xlsx');
    });
  </script>
</body>
</html>
